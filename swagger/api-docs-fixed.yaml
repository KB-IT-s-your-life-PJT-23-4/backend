swagger: '2.0'
info:
  description: MiriZoom 백엔드 REST API 명세. 인증 API에서 발급받은 Access Token은 Authorize에 'Bearer {token}' 형식으로 입력합니다.
  version: '1.1'
  title: MiriZoom Backend API
host: localhost:8080
basePath: /
tags:
- name: AI 상담 API
  description: Consult Controller
- name: FAQ API
  description: 사용자에게 제공할 FAQ 목록과 답변을 조회합니다.
- name: 관리자 FAQ 관리 API
  description: 관리자 페이지에서 FAQ와 FAQ 카테고리를 조회·생성·수정·삭제합니다.
- name: 관리자 감사 로그 API
  description: Api Audit Log Controller
- name: 관리자 대시보드 API
  description: 서비스 핵심 운영 지표 조회
- name: 관리자 배치 작업 관리 API
  description: Admin Batch Controller
- name: 관리자 상품 관리 API
  description: Admin Product Controller
- name: 관리자 세법 관리 API
  description: Admin Law Tax Controller
- name: 관리자 신고 관리 API
  description: Admin Report Controller
- name: 관리자 알림 API
  description: Admin Notification Controller
- name: 관리자 인증 API
  description: 현재 관리자 인증 및 권한 확인
- name: 관리자 접근 로그 실시간 API
  description: Admin Access Sse Controller
- name: 관리자 회원 관리 API
  description: 회원 검색과 서비스 이용 현황 조회
- name: 리마인더 API
  description: 로그인 사용자의 증여 일정 및 신고 기한 알림을 조회하고 읽음 처리합니다.
- name: 수증자 API
  description: 로그인 회원이 소유한 수증자 등록·조회·수정·삭제
- name: 영업점 검색 API
  description: 현재 위치를 기준으로 가까운 KB국민은행 영업점을 조회합니다.
- name: 영업점 대기표 API
  description: KB국민은행 영업점 대기표 발급, 호출 및 대기 현황 조회 기능을 제공합니다.
- name: 인증 API
  description: 로그인, Access/Refresh Token 재발급 및 로그아웃
- name: 장소 검색 API
  description: 카카오 로컬 API를 이용해 좌표 주변의 장소를 검색합니다.
- name: 증여 관리 API
  description: 로그인 사용자의 증여 내역, 공제 현황 및 신고 정보를 관리합니다.
- name: 증여 시뮬레이션 API
  description: 증여 시나리오 실행, 결과 조회, 포트폴리오 조정 및 저장 기능을 제공합니다.
- name: 증여 신고서 OCR API
  description: 증여세과세표준신고서 이미지에서 증여 이력 입력값을 추출
- name: 프로필 이미지 API
  description: 저장된 사용자 및 수증자 프로필 이미지를 조회합니다.
- name: 회원 API
  description: 회원가입, 이메일 중복 확인, 내 정보 조회·수정 및 회원탈퇴
paths:
  /api/admin/access-logs/stream:
    get:
      tags:
      - 관리자 접근 로그 실시간 API
      summary: subscribe
      operationId: subscribeUsingGET
      produces:
      - text/event-stream
      parameters:
      - name: Last-Event-ID
        in: header
        description: Last-Event-ID
        required: false
        type: string
      - name: authenticated
        in: query
        required: false
        type: boolean
      - name: authorities[0].authority
        in: query
        required: false
        type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/SseEmitter'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /api/admin/audit-logs:
    get:
      tags:
      - 관리자 감사 로그 API
      summary: getAuditLogs
      operationId: getAuditLogsUsingGET
      produces:
      - '*/*'
      parameters:
      - name: actionType
        in: query
        description: actionType
        required: false
        type: string
      - name: actorUserId
        in: query
        description: actorUserId
        required: false
        type: integer
        format: int64
      - name: authenticated
        in: query
        required: false
        type: boolean
      - name: authorities[0].authority
        in: query
        required: false
        type: string
      - name: from
        in: query
        description: from
        required: false
        type: string
        format: date-time
      - name: page
        in: query
        description: page
        required: false
        type: integer
        default: 0
        format: int32
      - name: size
        in: query
        description: size
        required: false
        type: integer
        default: 20
        format: int32
      - name: targetId
        in: query
        description: targetId
        required: false
        type: string
      - name: targetType
        in: query
        description: targetType
        required: false
        type: string
      - name: to
        in: query
        description: to
        required: false
        type: string
        format: date-time
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfAdminAuditLogPageResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /api/admin/auth:
    get:
      tags:
      - 관리자 인증 API
      summary: getAdmins
      operationId: getAdminsUsingGET
      produces:
      - '*/*'
      parameters:
      - name: authenticated
        in: query
        required: false
        type: boolean
      - name: authorities[0].authority
        in: query
        required: false
        type: string
      - name: page
        in: query
        description: page
        required: false
        type: integer
        default: 0
        format: int32
      - name: size
        in: query
        description: size
        required: false
        type: integer
        default: 10
        format: int32
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfAdminAuthPageResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /api/admin/auth/create:
    post:
      tags:
      - 관리자 인증 API
      summary: createAdmin
      operationId: createAdminUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: authenticated
        in: query
        required: false
        type: boolean
      - name: authorities[0].authority
        in: query
        required: false
        type: string
      - in: body
        name: request
        description: request
        required: true
        schema:
          $ref: '#/definitions/AdminAuthCreateRequest'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfAdminAuthResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /api/admin/auth/{userId}:
    delete:
      tags:
      - 관리자 인증 API
      summary: deleteAdmin
      operationId: deleteAdminUsingDELETE
      produces:
      - '*/*'
      parameters:
      - name: authenticated
        in: query
        required: false
        type: boolean
      - name: authorities[0].authority
        in: query
        required: false
        type: string
      - name: userId
        in: path
        description: userId
        required: true
        type: integer
        format: int64
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfVoid'
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
    patch:
      tags:
      - 관리자 인증 API
      summary: changeAdminAuth
      operationId: changeAdminAuthUsingPATCH
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: authenticated
        in: query
        required: false
        type: boolean
      - name: authorities[0].authority
        in: query
        required: false
        type: string
      - in: body
        name: request
        description: request
        required: true
        schema:
          $ref: '#/definitions/AdminChangeAuthRequest'
      - name: userId
        in: path
        description: userId
        required: true
        type: integer
        format: int64
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfVoid'
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /api/admin/batch/execution:
    get:
      tags:
      - 관리자 배치 작업 관리 API
      summary: getPageExecutionList
      operationId: getPageExecutionListUsingGET
      produces:
      - '*/*'
      parameters:
      - name: jobName
        in: query
        description: jobName
        required: false
        type: string
      - name: page
        in: query
        description: page
        required: false
        type: integer
        default: 0
        format: int32
      - name: size
        in: query
        description: size
        required: false
        type: integer
        default: 10
        format: int32
      - name: status
        in: query
        description: status
        required: false
        type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfBatchJobExecutionPageResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /api/admin/batch/execution/{jobExecutionId}/restart:
    post:
      tags:
      - 관리자 배치 작업 관리 API
      summary: 배치 실패 지점부터 재시작
      description: 실패했거나 중단된 실행을 같은 JobInstance 로 이어서 돌립니다. 성공한 Step 은 건너뜁니다.
      operationId: restartUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: authenticated
        in: query
        required: false
        type: boolean
      - name: authorities[0].authority
        in: query
        required: false
        type: string
      - name: jobExecutionId
        in: path
        description: jobExecutionId
        required: true
        type: integer
        format: int64
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfVoid'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /api/admin/batch/job:
    get:
      tags:
      - 관리자 배치 작업 관리 API
      summary: getJobList
      operationId: getJobListUsingGET
      produces:
      - '*/*'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfListOfBatchJobResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
      parameters: []
  /api/admin/batch/job/{jobName}/run:
    post:
      tags:
      - 관리자 배치 작업 관리 API
      summary: 배치 수동 실행
      description: ROOT 또는 MIDDLE 관리자가 배치를 새 실행으로 띄웁니다.
      operationId: runUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: authenticated
        in: query
        required: false
        type: boolean
      - name: authorities[0].authority
        in: query
        required: false
        type: string
      - name: jobName
        in: path
        description: jobName
        required: true
        type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfVoid'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /api/admin/dashboard:
    get:
      tags:
      - 관리자 대시보드 API
      summary: 관리자 대시보드 조회
      description: 한국 시간 기준 최근 7일의 가입자·시뮬레이션 통계와 최신 상품 통계를 조회합니다.
      operationId: getDashboardUsingGET
      produces:
      - '*/*'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfAdminDashboardResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
      parameters: []
  /api/admin/faq:
    get:
      tags:
      - 관리자 FAQ 관리 API
      summary: FAQ 목록 조회
      description: FAQ 목록을 페이지 단위로 조회합니다. 카테고리와 검색어 조건을 선택적으로 적용할 수 있습니다.
      operationId: getFaqPageUsingGET
      produces:
      - '*/*'
      parameters:
      - name: categoryId
        in: query
        description: 조회할 카테고리 ID. 생략하면 전체 카테고리를 조회합니다.
        required: false
        type: integer
        format: int64
        allowEmptyValue: false
        x-example: 1
      - name: keyword
        in: query
        description: FAQ 질문 또는 프롬프트 검색어
        required: false
        type: string
        allowEmptyValue: false
        x-example: 증여세 신고
      - name: name
        in: query
        required: false
        type: string
      - name: page
        in: query
        description: 0부터 시작하는 페이지 번호
        required: false
        type: integer
        default: 0
        format: int32
        allowEmptyValue: false
        x-example: 0
      - name: role
        in: query
        required: false
        type: string
      - name: size
        in: query
        description: 페이지당 FAQ 개수
        required: false
        type: integer
        default: 10
        maximum: 100
        exclusiveMaximum: false
        minimum: 1
        exclusiveMinimum: false
        format: int32
        allowEmptyValue: false
        x-example: 10
      - name: userId
        in: query
        required: false
        type: integer
        format: int64
      responses:
        '200':
          description: FAQ 목록 조회 성공
          schema:
            $ref: '#/definitions/ApiResponseOfAdminFaqPageResponse'
        '400':
          description: 페이지 또는 검색 조건이 올바르지 않음
          schema:
            $ref: '#/definitions/ApiResponse'
        '401':
          description: 인증 실패
          schema:
            $ref: '#/definitions/ApiResponse'
        '403':
          description: 관리자 권한 없음
          schema:
            $ref: '#/definitions/ApiResponse'
        '404':
          description: Not Found
        '500':
          description: 서버 또는 데이터베이스 처리 오류
          schema:
            $ref: '#/definitions/ApiResponse'
      security:
      - Bearer: []
      deprecated: false
    post:
      tags:
      - 관리자 FAQ 관리 API
      summary: FAQ 생성
      description: 선택한 카테고리에 새 FAQ를 생성하고 생성된 FAQ ID를 반환합니다.
      operationId: createFaqUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: name
        in: query
        required: false
        type: string
      - in: body
        name: request
        description: 생성할 FAQ 정보
        required: true
        schema:
          $ref: '#/definitions/AdminFaqRequest'
      - name: role
        in: query
        required: false
        type: string
      - name: userId
        in: query
        required: false
        type: integer
        format: int64
      responses:
        '200':
          description: FAQ 생성 성공
          schema:
            $ref: '#/definitions/ApiResponseOfAdminFaqResponse'
        '201':
          description: Created
        '400':
          description: FAQ 요청값 검증 실패
          schema:
            $ref: '#/definitions/ApiResponse'
        '401':
          description: 인증 실패
          schema:
            $ref: '#/definitions/ApiResponse'
        '403':
          description: 관리자 권한 없음
          schema:
            $ref: '#/definitions/ApiResponse'
        '404':
          description: Not Found
        '500':
          description: 서버 또는 데이터베이스 처리 오류
          schema:
            $ref: '#/definitions/ApiResponse'
      security:
      - Bearer: []
      deprecated: false
  /api/admin/faq/category:
    get:
      tags:
      - 관리자 FAQ 관리 API
      summary: FAQ 카테고리 목록 조회
      description: FAQ 등록과 필터에 사용하는 전체 카테고리 목록을 조회합니다.
      operationId: getFaqCategoriesUsingGET
      produces:
      - '*/*'
      parameters:
      - name: name
        in: query
        required: false
        type: string
      - name: role
        in: query
        required: false
        type: string
      - name: userId
        in: query
        required: false
        type: integer
        format: int64
      responses:
        '200':
          description: FAQ 카테고리 목록 조회 성공
          schema:
            $ref: '#/definitions/ApiResponseOfAdminFaqCategoriesDto'
        '401':
          description: 인증 실패
          schema:
            $ref: '#/definitions/ApiResponse'
        '403':
          description: 관리자 권한 없음
          schema:
            $ref: '#/definitions/ApiResponse'
        '404':
          description: Not Found
        '500':
          description: 서버 또는 데이터베이스 처리 오류
          schema:
            $ref: '#/definitions/ApiResponse'
      security:
      - Bearer: []
      deprecated: false
    post:
      tags:
      - 관리자 FAQ 관리 API
      summary: FAQ 카테고리 생성
      description: 새 FAQ 카테고리를 생성하고 생성된 카테고리 ID를 반환합니다. categoryId는 생략할 수 있습니다.
      operationId: createCategoryUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: name
        in: query
        required: false
        type: string
      - in: body
        name: request
        description: 생성할 FAQ 카테고리 정보
        required: true
        schema:
          $ref: '#/definitions/AdminCategoryRequest'
      - name: role
        in: query
        required: false
        type: string
      - name: userId
        in: query
        required: false
        type: integer
        format: int64
      responses:
        '200':
          description: FAQ 카테고리 생성 성공
          schema:
            $ref: '#/definitions/ApiResponseOfAdminCategoryResponse'
        '201':
          description: Created
        '400':
          description: 카테고리 요청값 검증 실패
          schema:
            $ref: '#/definitions/ApiResponse'
        '401':
          description: 인증 실패
          schema:
            $ref: '#/definitions/ApiResponse'
        '403':
          description: 관리자 권한 없음
          schema:
            $ref: '#/definitions/ApiResponse'
        '404':
          description: Not Found
        '500':
          description: 서버 또는 데이터베이스 처리 오류
          schema:
            $ref: '#/definitions/ApiResponse'
      security:
      - Bearer: []
      deprecated: false
    patch:
      tags:
      - 관리자 FAQ 관리 API
      summary: FAQ 카테고리 수정
      description: categoryId에 해당하는 FAQ 카테고리 이름을 수정합니다.
      operationId: updateCategoryUsingPATCH
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: name
        in: query
        required: false
        type: string
      - in: body
        name: request
        description: 수정할 FAQ 카테고리 ID와 이름
        required: true
        schema:
          $ref: '#/definitions/AdminCategoryRequest'
      - name: role
        in: query
        required: false
        type: string
      - name: userId
        in: query
        required: false
        type: integer
        format: int64
      responses:
        '200':
          description: FAQ 카테고리 수정 성공
          schema:
            $ref: '#/definitions/ApiResponseOfAdminCategoryResponse'
        '204':
          description: No Content
        '400':
          description: 카테고리 요청값 검증 실패
          schema:
            $ref: '#/definitions/ApiResponse'
        '401':
          description: 인증 실패
          schema:
            $ref: '#/definitions/ApiResponse'
        '403':
          description: 관리자 권한 없음
          schema:
            $ref: '#/definitions/ApiResponse'
        '404':
          description: FAQ 카테고리를 찾을 수 없음
          schema:
            $ref: '#/definitions/ApiResponse'
        '500':
          description: 서버 또는 데이터베이스 처리 오류
          schema:
            $ref: '#/definitions/ApiResponse'
      security:
      - Bearer: []
      deprecated: false
