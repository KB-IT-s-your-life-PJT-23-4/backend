      description: 목록에서 받은 증여 ID와 알림 유형을 기준으로 리마인더를 읽음 처리합니다.
      operationId: markReadUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - in: body
        name: reminderReadRequest
        description: reminderReadRequest
        required: true
        schema:
          $ref: '#/definitions/ReminderReadRequest'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfVoid'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - Bearer: []
      deprecated: false
  /api/tickets:
    post:
      tags:
      - 영업점 대기표 API
      summary: 대기표 발급
      description: 로그인 사용자에게 선택한 영업점과 업무 유형의 대기표를 발급합니다.
      operationId: issueUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - in: body
        name: request
        description: request
        required: true
        schema:
          $ref: '#/definitions/TicketIssueRequest'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfTicketIssueResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - Bearer: []
      deprecated: false
  /api/tickets/call:
    post:
      tags:
      - 영업점 대기표 API
      summary: 다음 대기표 호출
      description: 선택한 영업점에서 대기 중인 다음 번호를 호출합니다.
      operationId: callNextUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - in: body
        name: request
        description: request
        required: true
        schema:
          $ref: '#/definitions/TicketCallRequest'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfTicketCallResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - Bearer: []
      deprecated: false
  /api/tickets/status:
    get:
      tags:
      - 영업점 대기표 API
      summary: 영업점 대기 현황 조회
      description: 선택한 영업점의 현재 호출 번호와 대기 인원을 조회합니다.
      operationId: statusUsingGET
      produces:
      - '*/*'
      parameters:
      - name: branchId
        in: query
        description: 영업점 ID
        required: true
        type: integer
        format: int64
        allowEmptyValue: false
        x-example: 1
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ApiResponseOfTicketStatusResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /api/users/me:
    get:
      tags:
      - 회원 API
      summary: 내 정보 조회
      description: Access Token의 사용자 ID로 회원 정보를 조회합니다. 비밀번호는 응답하지 않습니다.
      operationId: getMyProfileUsingGET
      produces:
      - '*/*'
      parameters:
      - name: authenticated
        in: query
        required: false
        type: boolean
      - name: authorities[0].authority
        in: query
        required: false
        type: string
      responses:
        '200':
          description: 내 정보 조회 성공
          schema:
            $ref: '#/definitions/ApiResponseOfUserDTO'
        '401':
          description: 인증 실패
          schema:
            $ref: '#/definitions/ApiResponse'
        '403':
          description: Forbidden
        '404':
          description: 회원 정보 없음
          schema:
            $ref: '#/definitions/ApiResponse'
      security:
      - Bearer: []
      deprecated: false
    put:
      tags:
      - 회원 API
      summary: 내 정보 수정(JSON)
      description: 이메일, 이름, 생년월일, 전화번호와 이미지 경로를 JSON으로 수정하는 기존 API입니다.
      operationId: updateMyProfileUsingPUT
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: authenticated
        in: query
        required: false
        type: boolean
      - name: authorities[0].authority
        in: query
        required: false
        type: string
      - in: body
        name: updateRequest
        description: updateRequest
        required: true
        schema:
          $ref: '#/definitions/UserUpdateRequest'
      responses:
        '200':
          description: 수정 성공(body statusCode 203)
          schema:
            $ref: '#/definitions/ApiResponseOfUserDTO'
        '201':
          description: Created
        '400':
          description: 입력값 검증 실패
          schema:
            $ref: '#/definitions/ApiResponse'
        '401':
          description: 인증 실패
          schema:
            $ref: '#/definitions/ApiResponse'
        '403':
          description: Forbidden
        '404':
          description: 회원 정보 없음
          schema:
            $ref: '#/definitions/ApiResponse'
        '409':
          description: 이메일 또는 전화번호 중복
          schema:
            $ref: '#/definitions/ApiResponse'
      security:
      - Bearer: []
      deprecated: false
    delete:
      tags:
      - 회원 API
      summary: 회원탈퇴
      description: Access Token의 회원 개인정보와 직접 연결된 데이터를 삭제하고, ON DELETE CASCADE로 연결된 회원 소유 데이터도 함께 삭제합니다. 클라이언트는 성공 후 로그아웃 API로
        토큰을 폐기해야 합니다.
      operationId: deleteMyAccountUsingDELETE
      produces:
      - '*/*'
      parameters:
      - name: authenticated
        in: query
        required: false
        type: boolean
      - name: authorities[0].authority
        in: query
        required: false
        type: string
      responses:
        '200':
          description: 회원탈퇴 성공(body statusCode 204)
          schema:
            $ref: '#/definitions/ApiResponseOfVoid'
        '204':
          description: No Content
        '401':
          description: 인증 실패
          schema:
            $ref: '#/definitions/ApiResponse'
        '403':
          description: Forbidden
        '404':
          description: 회원 정보 없음
          schema:
            $ref: '#/definitions/ApiResponse'
      security:
      - Bearer: []
      deprecated: false
